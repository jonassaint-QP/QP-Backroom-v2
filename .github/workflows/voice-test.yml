name: Voice Test

on:
  workflow_dispatch:
    inputs:
      turns:
        description: Path to the turns file in this repo
        required: true
        default: scripts/internal-courtroom-01.turns.json
      episode_id:
        description: Episode slug used for output filenames
        required: true
        default: internal-courtroom-01
      speed:
        description: Playback speed multiplier (1.0 = model pace, 1.1 = slightly quicker)
        required: false
        default: '1'
      style:
        description: Style prompt. Leave blank for the built-in one - fill it in to A/B a change.
        required: false
        default: ''

jobs:
  voice-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Voice the turns
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_MODEL: gemini-3.1-flash-tts-preview
          TTS_SPEED: ${{ inputs.speed }}
          TTS_STYLE: ${{ inputs.style }}
        run: node render/voice-test.mjs "${{ inputs.turns }}" "${{ inputs.episode_id }}"
      - name: Upload voice test
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.episode_id }}-voice-test
          path: out/
