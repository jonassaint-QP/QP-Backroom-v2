name: Layer 5 - End of Day Reconciliation

on:
  schedule:
    # 23:59 Eastern is the next day in UTC, so the range shifts by one; 1-5 was
    # Sunday through Thursday Eastern, dropping Friday and running a day early.
    # Known limitation: UTC scheduling drifts by an hour with daylight saving;
    # only a job reading its own date can correct it.
    - cron: '59 3 * * 2-6'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QP-Backroom-v2
        uses: actions/checkout@v5

      - name: Check day-log input
        id: day_log
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f memory/inbox/day-log.md ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Day-log input: present=true"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning file=memory/inbox/day-log.md::Day-log input is missing; present=false. This stub will continue without reconciliation."
          fi

      - name: Unimplemented filing of memory entries
        shell: bash
        run: |
          set -euo pipefail
          echo "Unimplemented: file the day's events into memory, screening for client identity first."

      - name: Unimplemented workflow updates
        shell: bash
        run: |
          set -euo pipefail
          echo "Unimplemented: update recurring records whose scope names anything retired."

      - name: Unimplemented agent binding rebalancing
        shell: bash
        run: |
          set -euo pipefail
          echo "Unimplemented: rebalance agent permissions, limits, delegation and memory bindings."

      - name: Unimplemented rule recording with rationale
        shell: bash
        run: |
          set -euo pipefail
          echo "Unimplemented: record any rule established today, with its date and its reason."

      - name: Unimplemented archiving of superseded rules
        shell: bash
        run: |
          set -euo pipefail
          echo "Unimplemented: archive superseded entries with a forward link. Never delete."

      - name: Unimplemented policy auditing
        shell: bash
        run: |
          set -euo pipefail
          echo "Unimplemented: audit the full policy set, not a subset of it."

      - name: Unimplemented correction appending
        shell: bash
        run: |
          set -euo pipefail
          echo "Unimplemented: append to the corrections log."

      - name: Report reconciliation status
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          # NOT A PASS, NO RECONCILIATION PERFORMED

          This workflow is a stub containing no filing, updating, rebalancing, rule recording, archiving, auditing or correction logic.

          This run must not be read as evidence that anything was reconciled.

          A producer for the input feed is required.
          SUMMARY
