name: Voice Audition

on:
  workflow_dispatch:
    inputs:
      turns:
        description: Path to the turns file in this repo
        required: true
        default: scripts/internal-courtroom-01.turns.json
      voice:
        description: Voice id to audition (e.g. Fenrir, Orus, Puck). Not an AI Studio display name.
        required: true
        default: Fenrir
      host:
        description: Whose lines to read (David or Jason)
        required: true
        default: David
      model:
        description: TTS model. 3.8 is the current standard and where the newer voice library lives.
        required: false
        default: gemini-3.8-flash-tts
      speed:
        description: Playback speed multiplier (1.0 = model pace, 1.2 = approved for podcast)
        required: false
        default: '1.2'
      style:
        description: Style prompt. Leave blank for the built-in one - fill it in to A/B a change.
        required: false
        default: ''

jobs:
  voice-audition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Voice the lines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_MODEL: ${{ inputs.model }}
          TTS_SPEED: ${{ inputs.speed }}
          TTS_STYLE: ${{ inputs.style }}
        run: node render/voice-audition.mjs "${{ inputs.turns }}" "${{ inputs.voice }}" "${{ inputs.host }}"
      - name: Upload audition
        uses: actions/upload-artifact@v5
        with:
          name: audition-${{ inputs.voice }}-${{ inputs.host }}
          path: out/
