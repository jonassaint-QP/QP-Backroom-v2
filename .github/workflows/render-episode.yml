name: Render Episode

on:
  workflow_dispatch:
    inputs:
      brief:
        description: Path to the episode brief in this repo
        required: true
        default: prompts/episode-brief-internal-courtroom.md
      episode_id:
        description: Episode slug used for output filenames
        required: true
        default: internal-courtroom-01
      speed:
        description: Playback speed multiplier. 1.2 is the approved setting.
        required: false
        default: '1.2'
      style:
        description: Style prompt. Leave blank for the built-in one - fill it in to A/B a change.
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEXT_MODEL: gemini-3.1-pro-preview
          TTS_MODEL: gemini-3.1-flash-tts-preview
          TTS_SPEED: ${{ inputs.speed }}
          TTS_STYLE: ${{ inputs.style }}
        run: node render/render-episode.mjs "${{ inputs.brief }}" "${{ inputs.episode_id }}"
      - name: Upload episode
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.episode_id }}
          path: out/
